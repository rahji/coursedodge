<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coursedog Enabler</title>
    <style>
        body {
            width: 240px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f8fafc;
            color: #1e293b;
        }
        h2 {
            font-size: 14px;
            margin: 0 0 8px 0;
            color: #0f172a;
        }
        p {
            font-size: 11px;
            color: #64748b;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }
        button {
            width: 100%;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <h2>Coursedog Enabler</h2>
    <p>Instantly remove disabled and readonly attributes on active coursedog.com sheets.</p>
    <button id="enableBtn">Force Enable Elements</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
